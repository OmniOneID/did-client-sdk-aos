// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'org.omnione.did.sdk.wallet'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk 26
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments = ["notPackage": "org.bouncycastle.pqc.crypto.qtesla"]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    lint {
        targetSdk = 36
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            it.include '**/*Test.class'
        }
    }
}

ext {
    customVersionMajorMinorBuild = "3.0.0"
}

task deleteObjectJar(type: Delete){
    delete "../release/${project.name}-${customVersionMajorMinorBuild}.jar"
}

task exportJar(type: Copy){
    from('build/intermediates/aar_main_jar/release/syncReleaseLibJars/')
    into('../release/')
//    into('../../../did-ca-aos/source/did-ca-aos/app/libs')
    include('classes.jar')
    rename('classes.jar', "${project.name}-${customVersionMajorMinorBuild}.jar")
}


exportJar.dependsOn(deleteObjectJar, build)

dependencies {
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.espresso.core

    implementation libs.bitcoinj.core

    api libs.room.runtime
    annotationProcessor libs.room.compiler

    implementation libs.gson
    implementation libs.biometric

    implementation libs.spongycastle.core
    implementation libs.spongycastle.prov

    compileOnly libs.nimbus.jose.jwt

    compileOnly libs.upokecenter.cbor
    testImplementation libs.upokecenter.cbor
}